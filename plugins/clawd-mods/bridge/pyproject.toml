[project]
name = "clawd-bridge"
version = "0.1.0"
description = "Claude Code の Clawd 状態を BLE で Cardputer へ中継する常駐デーモン"
requires-python = ">=3.12"
dependencies = ["bleak>=0.22", "aiohttp>=3.9"]

[project.scripts]
clawd-bridge = "clawd_bridge.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "PLC0415"]

[tool.ruff]
line-length = 120
